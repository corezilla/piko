<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980" role="img" aria-labelledby="title desc">
<title id="title">Piko 应用场景</title>
<desc id="desc">左侧 Slinky 可将单个任务路由到中部 Piko 实例 A 至 Piko 实例 N 中的一个，省略号表示中间还可有其他实例；图中的独立直线表示可选路由，不代表广播、复制或同时发送。Piko 实例分别连接右侧同一个 LLMTier。上方 Matrix 通过细紫色虚线与 Slinky 及 Piko 实例通信，不连接 LLMTier。Target 场景示意，不代表生产部署或验收。</desc>
<defs>
  <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#dceafb"/></linearGradient>
  <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#dfe5eb"/><stop offset="1" stop-color="#bcc6d0"/></linearGradient>
  <linearGradient id="server" x2="0" y2="1"><stop stop-color="#f5f8fb"/><stop offset="1" stop-color="#cbd5de"/></linearGradient>
  <linearGradient id="matrix" x2="0" y2="1"><stop stop-color="#f4edfb"/><stop offset="1" stop-color="#ded0ef"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#8092a4" flood-opacity=".18"/></filter>
  <style>
    text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20344b}
    .title{font-size:34px;font-weight:700}
    .subtitle{font-size:18px;fill:#5a6f83}
    .label{font-size:24px;font-weight:700}
    .sub{font-size:17px;fill:#536a80}
    .micro{font-size:15px;fill:#536a80}
    .data{fill:none;stroke:#287bc1;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    .comm-halo{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
    .comm{fill:none;stroke:#32a56b;stroke-width:3;stroke-dasharray:7 8;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>

<rect width="1680" height="980" fill="#fff"/>
<text x="52" y="58" class="title">Piko 应用场景</text>
<text x="52" y="89" class="subtitle">Target 场景示意 · 两个 Piko 实例分别位于不同机器 · 不代表生产部署或验收</text>

<!-- 独立的主数据通道：不分叉、不汇合；一次任务择一 Piko 实例。 -->
<g class="data">
  <path d="M362 465 L748 404"/>
  <path d="M362 538 L748 692"/>
  <path d="M1130 405 L1358 467"/>
  <path d="M1130 695 L1358 566"/>
</g>
<path d="M770 400 L748 390 L751 411 Z" fill="#287bc1"/>
<path d="M770 700 L746 700 L752 685 Z" fill="#287bc1"/>
<path d="M1380 473 L1358 459 L1362 477 Z" fill="#287bc1"/>
<path d="M1380 555 L1358 566 L1354 550 Z" fill="#287bc1"/>
<text x="560" y="542" text-anchor="middle" class="micro" fill="#287bc1">单任务择一 · 不广播</text>
<text x="1285" y="532" text-anchor="middle" class="micro" fill="#287bc1">各自请求同一 LLMTier</text>

<!-- Matrix collaboration channels are thinner and dashed; crossings are bridges, not data-path junctions. -->
<g class="comm-halo">
  <path d="M340 420 L530 238"/>
  <path d="M655 238 L930 330"/>
  <path d="M590 238 L790 700"/>
</g>
<g class="comm">
  <path d="M340 420 L530 238"/>
  <path d="M655 238 L930 330"/>
  <path d="M590 238 L790 700"/>
</g>

<!-- Slinky workstation -->
<g filter="url(#shadow)">
  <rect x="92" y="420" width="250" height="162" rx="15" fill="#25394e"/>
  <rect x="103" y="431" width="228" height="137" rx="8" fill="url(#screen)"/>
  <circle cx="217" cy="499" r="22" fill="#3282cb"/>
  <path d="M211 487 L229 499 L211 511 Z" fill="#fff"/>
  <rect x="139" y="528" width="34" height="20" rx="6" fill="#83b1e5"/>
  <rect x="182" y="528" width="34" height="20" rx="6" fill="#b7d2ef"/>
  <rect x="225" y="528" width="34" height="20" rx="6" fill="#83b1e5"/>
  <path d="M187 582 H247 L264 616 H170 Z" fill="url(#metal)" stroke="#9cabb9" stroke-width="2"/>
  <path d="M102 621 H332 L366 644 H72 Z" fill="url(#metal)" stroke="#aab7c3" stroke-width="2"/>
  <path d="M132 628 H307" stroke="#8798a8" stroke-width="3" stroke-dasharray="3 6"/>
</g>
<text x="218" y="686" text-anchor="middle" class="label">Slinky</text>
<text x="218" y="714" text-anchor="middle" class="sub">任务提交与结果处理</text>

<!-- Matrix shared collaboration service, placed higher than the Piko instances. -->
<g filter="url(#shadow)">
  <rect x="495" y="130" width="190" height="108" rx="17" fill="url(#matrix)" stroke="#9e84bd" stroke-width="2.5"/>
  <rect x="517" y="145" width="146" height="43" rx="12" fill="#fff" stroke="#c3b0d7" stroke-width="2"/>
  <circle cx="552" cy="166" r="6" fill="#8b6bb3"/>
  <circle cx="590" cy="166" r="6" fill="#8b6bb3"/>
  <circle cx="628" cy="166" r="6" fill="#8b6bb3"/>
</g>
<text x="590" y="225" text-anchor="middle" class="label">Matrix</text>

<!-- Piko instance A: separate host / machine A. -->
<g filter="url(#shadow)">
  <rect x="790" y="330" width="320" height="190" rx="20" fill="#f4f8fc" stroke="#91abc3" stroke-width="2.5"/>
  <rect x="834" y="358" width="232" height="113" rx="13" fill="url(#server)" stroke="#9aaab8" stroke-width="2"/>
  <rect x="851" y="376" width="198" height="26" rx="6" fill="#344b61"/>
  <rect x="851" y="412" width="198" height="26" rx="6" fill="#344b61"/>
  <circle cx="1031" cy="389" r="4" fill="#52bd84"/><circle cx="1031" cy="425" r="4" fill="#52bd84"/>
  <path d="M865 389 H1000 M865 425 H1000" stroke="#8fa2b4" stroke-width="3"/>
</g>
<text x="950" y="493" text-anchor="middle" class="label">Piko · 机器 A</text>

<!-- Piko instance B: independently placed on machine B. -->
<g filter="url(#shadow)">
  <rect x="790" y="620" width="320" height="190" rx="20" fill="#f4f8fc" stroke="#91abc3" stroke-width="2.5"/>
  <rect x="834" y="648" width="232" height="113" rx="13" fill="url(#server)" stroke="#9aaab8" stroke-width="2"/>
  <rect x="851" y="666" width="198" height="26" rx="6" fill="#344b61"/>
  <rect x="851" y="702" width="198" height="26" rx="6" fill="#344b61"/>
  <circle cx="1031" cy="679" r="4" fill="#52bd84"/><circle cx="1031" cy="715" r="4" fill="#52bd84"/>
  <path d="M865 679 H1000 M865 715 H1000" stroke="#8fa2b4" stroke-width="3"/>
</g>
<text x="950" y="783" text-anchor="middle" class="label">Piko N · 机器 B</text>

<!-- Vertical ellipsis indicates the omitted Piko instances between A and N. -->
<text x="950" y="582" text-anchor="middle" font-size="42" font-weight="700" fill="#75889a">⋮</text>

<!-- One shared downstream model service. -->
<g filter="url(#shadow)">
  <path d="M1420 468 C1420 425 1453 394 1495 394 C1524 352 1594 365 1608 414 C1657 423 1670 484 1636 516 C1641 558 1604 586 1565 573 H1462 C1415 573 1390 523 1420 488 Z" fill="#edf6fb" stroke="#76a9c5" stroke-width="2.5"/>
  <rect x="1439" y="455" width="185" height="92" rx="13" fill="url(#server)" stroke="#8ea5b6" stroke-width="2"/>
  <rect x="1454" y="470" width="155" height="19" rx="5" fill="#304b63"/>
  <rect x="1454" y="496" width="155" height="19" rx="5" fill="#304b63"/>
  <rect x="1454" y="522" width="155" height="12" rx="5" fill="#304b63"/>
  <circle cx="1595" cy="480" r="3.5" fill="#42aaa1"/><circle cx="1595" cy="506" r="3.5" fill="#42aaa1"/>
</g>
<text x="1525" y="626" text-anchor="middle" class="label">LLMTier</text>
<text x="1525" y="653" text-anchor="middle" class="sub">共享模型推理服务</text>

<!-- Compact channel legend -->
<path d="M56 904 H128" stroke="#287bc1" stroke-width="7" stroke-linecap="round"/>
<path d="M128 904 L112 895 L112 913 Z" fill="#287bc1"/>
<text x="145" y="911" class="sub">绿色粗箭头：主数据通道</text>
<path d="M410 904 H482" stroke="#32a56b" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round"/>
<text x="498" y="911" class="sub">绿色细虚线：Matrix 通讯通道（双向协作）</text>
<text x="56" y="951" class="micro">每个任务只路由到一个 Piko 实例，不复制或同时广播；各 Piko 实例可独立连接同一个 LLMTier。Matrix 只供 Slinky 与 Piko 实例协作通信。</text>
</svg>
