openapi: 3.1.0
info:
  title: Piko Agent Runtime Matrix/Element 增量 API 草案
  version: 0.3.0
  description: >-
    扩展 agent-runtime v0.2 的 v0.3 中文评审草案。本文只描述 Matrix/Element
    增量接口；它们仍由唯一 Agent Runtime 服务实现，不构成第二条运行时路径。
x-base-contract: agent-runtime-openapi-v0.2.yaml
x-agent-task-request-extension:
  $ref: './schemas/agent-runtime-matrix-v0.3.schema.json#/$defs/AgentTaskRequestCollaborationExtension'
servers:
  - url: https://piko.example/agent-runtime/v1
security:
  - bearerAuth: []
paths:
  /operator/matrix-transport-profile:
    get:
      operationId: getMatrixTransportProfile
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 当前 Operator Matrix transport profile；不含 Secret。
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatrixTransportProfileEnvelope'}
        '304': {$ref: '#/components/responses/NotModified'}
        '404': {$ref: '#/components/responses/ApiError'}
    put:
      operationId: putMatrixTransportProfile
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/IfNoneMatchOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schemas/agent-runtime-matrix-v0.3.schema.json#/$defs/MatrixTransportProfileRequest'}
      responses:
        '200':
          description: 已按当前 ETag 幂等更新。
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatrixTransportProfileEnvelope'}
        '201':
          description: 已在 If-None-Match 星号前置条件下创建。
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatrixTransportProfileEnvelope'}
        '409': {$ref: '#/components/responses/ApiError'}
        '412': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
  /operator/matrix-transport-profile:probe:
    post:
      operationId: probeMatrixTransportProfile
      description: 只读探测；不得创建 identity、room、Session 或推进 checkpoint。
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schemas/agent-runtime-matrix-v0.3.schema.json#/$defs/MatrixTransportProbeRequest'}
      responses:
        '200':
          description: 探测结果。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatrixTransportProbeEnvelope'}
        '404': {$ref: '#/components/responses/ApiError'}
        '412': {$ref: '#/components/responses/ApiError'}
        '503': {$ref: '#/components/responses/ApiError'}
  /projects/{project_id}/ir-communication-bindings/{ir_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IrId'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SourceInstanceId'
    get:
      operationId: getIrCommunicationBinding
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 当前 IR communication binding；不含 Secret。
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IrCommunicationBindingEnvelope'}
        '304': {$ref: '#/components/responses/NotModified'}
        '404': {$ref: '#/components/responses/ApiError'}
    put:
      operationId: putIrCommunicationBinding
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/IfNoneMatchOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schemas/agent-runtime-matrix-v0.3.schema.json#/$defs/IRCommunicationBindingRequest'}
      responses:
        '200':
          description: 已幂等更新；rename 不改变 Matrix User ID。
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IrCommunicationBindingEnvelope'}
        '201':
          description: 已幂等创建稳定 IR identity binding。
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IrCommunicationBindingEnvelope'}
        '409': {$ref: '#/components/responses/ApiError'}
        '412': {$ref: '#/components/responses/ApiError'}
        '422': {$ref: '#/components/responses/ApiError'}
        '503': {$ref: '#/components/responses/ApiError'}
  /projects/{project_id}/collaboration-sessions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SourceInstanceId'
    get:
      operationId: listCollaborationSessions
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: agent_run_id
          in: query
          schema: {type: string, minLength: 1}
        - name: status
          in: query
          schema: {type: string}
      responses:
        '200':
          description: 当前 Client/Project scope 的 Session 分页列表。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollaborationSessionListEnvelope'}
        '404': {$ref: '#/components/responses/ApiError'}
  /projects/{project_id}/collaboration-sessions/{collaboration_session_id}/element-view:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/CollaborationSessionId'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SourceInstanceId'
    get:
      operationId: getElementConversationDescriptor
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 无 Secret 的 ExternalLink descriptor。
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ElementConversationDescriptorEnvelope'}
        '304': {$ref: '#/components/responses/NotModified'}
        '404': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
        '503': {$ref: '#/components/responses/ApiError'}
  /projects/{project_id}/collaboration-sessions/{collaboration_session_id}:close:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/CollaborationSessionId'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SourceInstanceId'
    post:
      operationId: closeCollaborationSession
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './schemas/agent-runtime-matrix-v0.3.schema.json#/$defs/CollaborationSessionCloseRequest'}
      responses:
        '200':
          description: 当前或已推进的 close outcome；未收敛时明确返回 pending delivery。
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollaborationSessionCloseEnvelope'}
        '404': {$ref: '#/components/responses/ApiError'}
        '409': {$ref: '#/components/responses/ApiError'}
        '412': {$ref: '#/components/responses/ApiError'}
        '503': {$ref: '#/components/responses/ApiError'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    ProjectId: {name: project_id, in: path, required: true, schema: {type: string, minLength: 1}}
    IrId: {name: ir_id, in: path, required: true, schema: {type: string, minLength: 1}}
    CollaborationSessionId: {name: collaboration_session_id, in: path, required: true, schema: {type: string, minLength: 1}}
    ClientId: {name: X-Agent-Runtime-Client-ID, in: header, required: true, schema: {type: string, minLength: 1}}
    SourceInstanceId: {name: X-Agent-Runtime-Source-Instance-ID, in: header, required: true, schema: {type: string, minLength: 1}}
    CorrelationId: {name: X-Correlation-ID, in: header, required: true, schema: {type: string, minLength: 1}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, minLength: 1}}
    IfMatchOptional: {name: If-Match, in: header, required: false, schema: {type: string, minLength: 1}}
    IfNoneMatch: {name: If-None-Match, in: header, required: false, schema: {type: string, minLength: 1}}
    IfNoneMatchOptional: {name: If-None-Match, in: header, required: false, schema: {type: string, minLength: 1}}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
  headers:
    ETag: {schema: {type: string}}
  schemas:
    GenericEnvelope:
      type: object
      additionalProperties: false
      required: [api_version, request_id, correlation_id, data, observed_at]
      properties:
        api_version: {const: agent-runtime/v1}
        request_id: {type: string}
        correlation_id: {type: string}
        data: {}
        observed_at: {type: string, format: date-time}
    MatrixTransportProfileEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericEnvelope'
        - type: object
          properties: {data: {$ref: './schemas/agent-runtime-matrix-v0.3.schema.json#/$defs/MatrixTransportProfileResult'}}
    MatrixTransportProbeEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericEnvelope'
        - type: object
          properties: {data: {$ref: './schemas/agent-runtime-matrix-v0.3.schema.json#/$defs/MatrixTransportProbeResult'}}
    IrCommunicationBindingEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericEnvelope'
        - type: object
          properties: {data: {$ref: './schemas/agent-runtime-matrix-v0.3.schema.json#/$defs/IRCommunicationBindingResult'}}
    CollaborationSessionListEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericEnvelope'
        - type: object
          properties: {data: {$ref: './schemas/agent-runtime-matrix-v0.3.schema.json#/$defs/CollaborationSessionList'}}
    ElementConversationDescriptorEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericEnvelope'
        - type: object
          properties: {data: {$ref: './schemas/agent-runtime-matrix-v0.3.schema.json#/$defs/ElementConversationDescriptor'}}
    CollaborationSessionCloseEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericEnvelope'
        - type: object
          properties: {data: {$ref: './schemas/agent-runtime-matrix-v0.3.schema.json#/$defs/CollaborationSessionCloseResult'}}
  responses:
    ApiError:
      description: 结构化错误；message 不参与 Client 分支判断。
      content:
        application/json:
          schema: {$ref: './schemas/agent-runtime-v0.2.schema.json#/$defs/ApiErrorEnvelope'}
    NotModified:
      description: ETag 仍为当前版本；无响应 body。
