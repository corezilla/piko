openapi: 3.1.0
info:
  title: Piko Agent Runtime API
  version: 0.3.0-simplified.5
  description: 单 Piko 实例、单 Agent 的轻量任务接口；runtime_activation=false。
servers:
  - url: https://piko.example/agent-runtime/v1
security:
  - bearerAuth: []
paths:
  /runs:
    post:
      operationId: createRun
      summary: 提交一个 Agent 任务
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/AgentTaskRequest'}
      responses:
        '202':
          description: 任务已持久化；不表示任务成功。
          content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/RunView'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/QueueFull'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /runs/{run_id}:
    get:
      operationId: getRun
      summary: 按稳定 run_id 查询当前或保留期内的历史任务状态
      parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/RequestId'}]
      responses:
        '200':
          description: 当前任务状态。
          content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/RunView'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
  /runs/{run_id}:cancel:
    post:
      operationId: cancelRun
      summary: 请求取消任务
      parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/RequestId'}]
      responses:
        '202':
          description: Running Run 的取消意图已持久化；不证明执行已停止。
          content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/CancelReceipt'}}}
        '200':
          description: Queued Run 已在启动前原子取消，或任务此前已经终态。
          content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/CancelReceipt'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
  /runs/{run_id}/result:
    get:
      operationId: getRunResult
      summary: 取得稳定任务结果
      parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/RequestId'}]
      responses:
        '200':
          description: 稳定终态结果；业务接受由调用方决定。
          content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/AgentResult'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/RunNotTerminal'}
        '410': {$ref: '#/components/responses/Gone'}
        '500': {$ref: '#/components/responses/ResultUnavailable'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    RunId: {name: run_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 255}
      description: 仅用于任务提交去重；不传播到模型调用。
    RequestId: {name: X-Request-ID, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
  responses:
    BadRequest: {$ref: '#/components/x-error-responses/BadRequest'}
    Unauthorized: {$ref: '#/components/x-error-responses/Unauthorized'}
    Forbidden: {$ref: '#/components/x-error-responses/Forbidden'}
    NotFound: {$ref: '#/components/x-error-responses/NotFound'}
    Conflict: {$ref: '#/components/x-error-responses/Conflict'}
    RunNotTerminal: {$ref: '#/components/x-error-responses/RunNotTerminal'}
    Unprocessable: {$ref: '#/components/x-error-responses/Unprocessable'}
    QueueFull: {$ref: '#/components/x-error-responses/QueueFull'}
    Unavailable: {$ref: '#/components/x-error-responses/Unavailable'}
    ResultUnavailable: {$ref: '#/components/x-error-responses/ResultUnavailable'}
    Gone: {$ref: '#/components/x-error-responses/Gone'}
  x-error-responses:
    BadRequest:
      description: 请求 JSON 或字段非法。
      x-error-codes: [InvalidRequest]
      content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/ErrorEnvelope'}}}
    Unauthorized:
      description: credential 缺失或无效。
      x-error-codes: [Unauthorized]
      content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/ErrorEnvelope'}}}
    Forbidden:
      description: 当前 Client 无所需 scope。
      x-error-codes: [ScopeDenied]
      content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/ErrorEnvelope'}}}
    NotFound:
      description: Run 不存在或对当前 Client 不可见。
      x-error-codes: [NotFound]
      content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/ErrorEnvelope'}}}
    Conflict:
      description: 任务 key、client_task_id 或讨论上下文冲突。
      x-error-codes: [IdempotencyConflict, ClientTaskConflict, InvalidDiscussionContext]
      content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/ErrorEnvelope'}}}
    RunNotTerminal:
      description: Run 尚未终态，结果不可读取。
      x-error-codes: [RunNotTerminal]
      content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/ErrorEnvelope'}}}
    Unprocessable:
      description: 语法正确但当前任务约束不可执行。
      x-error-codes: [UnsupportedLimit, DeadlineExpired]
      content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/ErrorEnvelope'}}}
    QueueFull:
      description: 有界本地任务队列已满；未创建 Run。
      x-error-codes: [QueueFull]
      headers: {Retry-After: {schema: {type: integer, minimum: 1}}}
      content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/ErrorEnvelope'}}}
    Unavailable:
      description: 受理所需的本实例依赖不可用；未创建 Run。
      x-error-codes: [DependencyUnavailable]
      headers: {Retry-After: {schema: {type: integer, minimum: 1}}}
      content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/ErrorEnvelope'}}}
    ResultUnavailable:
      description: Run 已终态但稳定 Result 缺失；这是内部一致性错误。
      x-error-codes: [ResultUnavailable]
      content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/ErrorEnvelope'}}}
    Gone:
      description: 保留窗口结束且存在可证明 tombstone。
      x-error-codes: [Gone]
      content: {application/json: {schema: {$ref: '../schemas/agent-runtime-v0.3.schema.json#/$defs/ErrorEnvelope'}}}
